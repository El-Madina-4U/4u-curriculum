<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Title shown in web browsers-->
    <title>Drawing club</title>

    <!-- Import fonts — نسخة محلية، الصفحة بتشتغل من غير نت -->
    <link href="fonts/fonts.css" rel="stylesheet" type="text/css" />

    <!-- Include CSS style file -->

     <link href="style.css" rel="stylesheet" type="text/css" /> 
     <link href="animation.css" rel="stylesheet" type="text/css" /> 
     <link href="default.css" rel="stylesheet" type="text/css" /> 
      <link href="palettes/pastel.css" rel="stylesheet" type="text/css">
  </head>

  <body>
    <!-- The page header code goes here -->
    <header class="border-bottom secondary">
      <h1>Drawing club</h1>
      <div class="hugefont">🎨</div>
    </header>

    <!-- The main content for the web page goes between the main tags -->
    <main>

      <section class="primary">
        <p>A weekly club where you learn to draw with friends.</p>
      </section>

      <section class="secondary">
        <ul>
          <li>No experience needed.</li>
          <li>All materials provided.</li>
          <li>One hour a week.</li>
        </ul>
      </section>

      <section class="tertiary">
        <blockquote>
          <p>I could not draw a circle. Now I draw every day.</p>
          <cite>Mona, age 14</cite>
        </blockquote>
      </section>

      <section class="primary xcenter">
        <h2>Join us on Saturday</h2>
        <a href="#">Sign up</a>
      </section>

    </main>

    <!-- Footer code goes here -->
    <footer class="border-top secondary">
      <p>Footer text</p>
    </footer>

  </body>
</html>
