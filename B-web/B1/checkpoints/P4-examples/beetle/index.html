<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Title shown in web browsers-->
    <title>Beetle jewellery</title>

    <!-- Import fonts — نسخة محلية، الصفحة بتشتغل من غير نت -->
    <link href="fonts/fonts.css" rel="stylesheet" type="text/css" />

    <!-- Include CSS style file -->

     <link href="style.css" rel="stylesheet" type="text/css" /> 
     <link href="animation.css" rel="stylesheet" type="text/css" /> 
     <link href="default.css" rel="stylesheet" type="text/css" /> 
  </head>

  <body>
    <!-- The page header code goes here -->
    <header class="border-bottom secondary">
      <h1>Beetle jewellery</h1>
    </header>

    <!-- The main content for the web page goes between the main tags -->
    <main>
      
      <!-- The sub heading section -->
      <section class="ycenter xcenter tertiary">
        <h2>A mood board ...</h2>
        <p>... with colours inspired by nature.</p>
      </section>
  

      <!-- Three tiles, one image and two text -->
      <section class="wrap xcenter">
        <img src="beetle.jpg" alt="Blue and green beetle on a leaf." />
        <div class="secondary ycenter tile"><h1>BEETLE</h1></div>
        <div class="tertiary ycenter tile">
          <h2>BEETLE<br />BEETLE<br />BEETLE</h2>
        </div>
      </section>
      
      <!-- Text on the left with an emoji on the right -->
      <section class="wrap">
        <div class="primary wide">
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam dicta
            reprehenderit omnis quae nobis reiciendis voluptatum beatae
            excepturi esse eum.
          </p>
        </div>
        <p class="narrow hugefont">
          🍂
        </p>
      </section>

      <!-- Three tiles, one image and two text -->

      <section class="wrap xcenter">
        <div class="tertiary ycenter tile">
          <h2>BEETLE<br />BEETLE<br />BEETLE</h2>
        </div>
        <img src="beetle.jpg" alt="Blue and green beetle on a leaf." />
        <div class="secondary ycenter tile"><h1>BEETLE</h1></div>
      </section>
      
    </main>

    <!-- Footer code goes here -->
    <footer class="border-top secondary">
      <p>🍂🍂🍂</p>
    </footer>

  </body>
</html>
